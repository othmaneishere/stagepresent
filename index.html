<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame</title><link rel="stylesheet" href="./styles.css"></head><body><div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">F</span><span>frame</span></div><div class="top-actions"><span class="status-dot"></span><span>Local canvas</span><button class="ghost-btn" id="presentBtn">Present ↗</button><button class="icon-btn" id="themeBtn">◐</button></div></header><main class="workspace"><aside class="sidebar left-panel"><div class="panel-head"><span>Deck</span><button class="mini-btn" id="addSlideBtn">+</button></div><div class="slides-list" id="slidesList"></div><div class="left-foot"><div class="hint">Type <b>clear</b> twice to reset</div><button class="reset-btn" id="resetBtn">Reset</button></div></aside><section class="canvas-area"><div class="canvas-toolbar"><div><span class="eyebrow">LIVE PREVIEW</span><span class="slide-count" id="slideCount">01 / 01</span></div><div class="toolbar-actions"><button class="tool-btn active">Edit</button><button class="tool-btn" id="gridBtn">Grid</button><button class="tool-btn" id="exportBtn">Export</button></div></div><div class="stage-wrap"><div class="stage" id="stage"></div></div><div class="timeline"><span class="playhead"></span><div class="timecodes"><span>00:00</span><span>00:00</span></div><div class="timeline-track"><span class="timeline-fill"></span></div></div></section><aside class="sidebar right-panel"><div class="panel-head"><span>Input</span><span class="ai-badge">VOICE</span></div><label class="field-label">Presentation direction</label><div class="voice-row"><textarea id="promptInput" class="prompt" aria-label="Presentation direction"></textarea><button class="mic-btn" id="micBtn" aria-label="Start voice input" title="Voice input">●</button></div><div class="voice-status" id="voiceStatus"></div><button class="generate-btn" id="generateBtn">Apply direction</button><div class="divider"></div><div class="panel-head"><span>Visual system</span><button class="mini-btn">⌘</button></div><div class="swatches"><span style="--c:#ff3b36"></span><span style="--c:#ffd400"></span><span style="--c:#141414"></span><span style="--c:#e9eef2"></span></div><div class="field-row"><label>Typeface</label><select id="fontSelect"><option value="dm">DM Sans</option><option value="plex">IBM Plex Sans Arabic</option><option value="cairo">Cairo</option></select></div><div class="field-row"><label>Motion</label><select id="motionSelect"><option value="cinematic">Cinematic ease</option><option value="snap">Sharp & snappy</option><option value="calm">Calm drift</option></select></div><div class="field-row"><label>Accent</label><div class="accent-row"><button class="accent active" data-accent="red"></button><button class="accent yellow" data-accent="yellow"></button><button class="accent blue" data-accent="blue"></button></div></div></aside></main></div><script src="./app.js"></script></body></html>
